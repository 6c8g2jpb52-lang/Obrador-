<style>
/* Layout: logo de Puro Umami arriba sobre la franja de rayas de la marca, una columna, cuatro pestañas abajo. Tema único claro, como el manual de marca. */
:root{
  /* Paleta del manual de marca Puro Umami */
  --cacao:#43302E;--caramelo:#84592B;--mantequilla:#FCF2C7;--crema:#FFFFEE;--salvia:#C2C395;
  --bg:var(--crema);--surface:#FFFFFF;--surface2:var(--mantequilla);--ink:var(--cacao);--muted:#7A675C;--line:#E7DFC2;
  --accent:var(--caramelo);--accent-ink:var(--crema);--accent-soft:var(--mantequilla);
  --ok:#55682A;--ok-soft:#ECEFD9;--warn:#8A5A12;--warn-soft:#FCF2C7;--bad:#A3392B;--bad-soft:#F7E1DA;
  --f-display:"EB Garamond","Iowan Old Style","Palatino Linotype",Palatino,Lora,Georgia,serif;
  --f-body:"Avenir Next",Avenir,"Nunito Sans",-apple-system,system-ui,"Segoe UI",sans-serif;
  --f-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 var(--f-body);-webkit-text-size-adjust:100%;
  padding:0 max(16px,env(safe-area-inset-right,0px)) calc(92px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
[hidden]{display:none!important}
.wrap{max-width:640px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0 10px}
header h1{font:700 22px/1.2 var(--f-display);margin:0;letter-spacing:-.01em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icon-btn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center;flex:none}
.icon-btn svg,nav svg,.photo svg{stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.lead{font:600 20px/1.25 var(--f-display);margin:6px 0 12px}
h2{font:700 20px/1.25 var(--f-display);margin:0 0 12px;text-wrap:balance}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:22px 0 8px;font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{position:relative;text-align:left;min-height:108px;padding:14px;border-radius:16px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;display:flex;flex-direction:column;gap:4px;justify-content:flex-start;min-width:0;cursor:pointer}
.tile:active{transform:scale(.98)}
.tile .tn{font:700 18px/1.2 var(--f-display);padding-right:46px}
.tile.sabor{min-height:120px;background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tile.sabor .tn{padding-right:0;font-size:20px}
.tile.sabor .ts{color:var(--accent-ink);opacity:.8}
.tile .tl{font-size:14px;overflow-wrap:anywhere}
.tile .ts{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.tile.add{border-style:dashed;align-items:center;justify-content:center;color:var(--muted);min-height:64px}
.thumb{position:absolute;top:10px;right:10px;width:42px;height:42px;border-radius:9px;object-fit:cover;background:var(--surface2)}
.code{font-family:var(--f-mono);font-weight:600;letter-spacing:.02em;overflow-wrap:anywhere}
.muted{color:var(--muted)}.small{font-size:14px}.warn{color:var(--warn)}.bad{color:var(--bad)}.okc{color:var(--ok)}
.card{display:block;width:100%;text-align:left;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;min-width:0}
button.card{cursor:pointer}
.th{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px}
.th b{font-size:16px;min-width:0}
.pill{font-size:13px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--accent-soft);color:var(--accent);white-space:nowrap;flex:none}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.warn{background:var(--warn-soft);color:var(--warn)}
.lots{display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 12px;font-size:14px}
.lots .k{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 16px var(--f-body);cursor:pointer}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.big{width:100%;min-height:56px;font-size:18px;margin-top:18px}
.btn.sm{min-height:38px;padding:0 12px;font-size:14px}
.btn.danger{color:var(--bad)}
.btn.full{width:100%}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:14px 0 5px}
input,select,textarea{width:100%;font:400 17px var(--f-body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;min-height:48px}
textarea{min-height:76px;resize:vertical}
input.lote{font:600 20px var(--f-mono);letter-spacing:.04em}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.hint{font-size:13px;color:var(--muted);margin-top:5px}
.photo{width:100%;min-height:150px;border:2px dashed var(--line);border-radius:14px;background:var(--bg);color:var(--accent);font:600 17px var(--f-body);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:0;overflow:hidden;cursor:pointer}
.photo img{width:100%;max-height:260px;object-fit:cover;display:block}
.photo.has{border-style:solid;min-height:0}
.photo .again{font-size:14px;padding:8px}
.lotrow{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;background:var(--surface)}
.lotrow.missing{border-color:var(--warn);background:var(--warn-soft)}
.lotrow .ln{font-weight:700}
.lotrow select{margin-top:6px;min-height:40px;font-size:15px;padding:6px 10px}
.step{display:flex;align-items:center;gap:8px}
.step button{width:48px;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 24px var(--f-body)}
.step output{min-width:44px;text-align:center;font:700 22px var(--f-display);font-variant-numeric:tabular-nums}
details.more{margin-top:16px;border:1px solid var(--line);border-radius:12px;padding:0 12px}
details.more summary{min-height:48px;display:flex;align-items:center;font-weight:600;color:var(--muted);cursor:pointer}
details.more[open]{padding-bottom:12px}
.month{margin-bottom:22px}
.mh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:8px 0 4px}
.mh h2{margin:0}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--warn-soft);color:var(--ink);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:14px}
.cam{display:grid;grid-template-columns:minmax(0,1fr) 120px;gap:10px;align-items:center}
.cam input{text-align:center;font:700 24px var(--f-mono)}
.live{font-size:14px;font-weight:600;margin-top:6px}
.check{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);min-height:54px;cursor:pointer}
.check:last-child{border-bottom:0}
.check input{width:26px;height:26px;min-height:0;accent-color:var(--ok);flex:none}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips label{display:inline-flex;align-items:center;gap:6px;margin:0;font-size:14px;font-weight:500;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:6px 12px;min-height:38px}
.chips input{width:auto;min-height:0;accent-color:var(--accent)}
.empty{border:1.5px dashed var(--line);border-radius:14px;padding:20px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}
.bigphoto{width:100%;border-radius:12px;margin:6px 0 10px;display:block}
.fotos{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.fotos img{width:84px;height:84px;object-fit:cover;border-radius:10px;background:var(--surface2)}
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:flex;padding:0 max(6px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(6px,env(safe-area-inset-left,0px))}
nav button{flex:1;border:0;background:transparent;color:var(--muted);font:600 12px var(--f-body);padding:9px 2px 8px;min-height:62px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer}
nav button svg{width:26px;height:26px}
nav button.on{color:var(--accent)}
dialog{border:0;padding:0;background:transparent;max-width:100%;width:100%;max-height:100%;color:var(--ink)}
dialog::backdrop{background:rgba(10,12,16,.55)}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-radius:18px 18px 0 0;max-width:640px;margin:0 auto;max-height:94vh;overflow:auto;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet .grip{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.sheet .grip span{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto}
.close{position:absolute;top:10px;right:max(12px,env(safe-area-inset-right,0px));width:40px;height:40px;border-radius:20px;border:0;background:var(--surface2);color:var(--ink);font:600 20px var(--f-body)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-size:15px;z-index:60;max-width:90%;text-align:center}
@media (prefers-reduced-motion:no-preference){.tile{transition:transform .08s}}

/* ===== Marca Puro Umami ===== */
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.rayas{height:12px;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));background:repeating-linear-gradient(90deg,var(--salvia) 0 16px,var(--crema) 16px 26px,var(--mantequilla) 26px 34px,var(--crema) 34px 44px)}
header{padding:12px 0 8px}
header h1.marca{display:flex;align-items:center;min-width:0}
header h1.marca img{height:46px;width:auto;max-width:100%;display:block}
.icon-btn{border-color:var(--line);background:var(--surface);color:var(--caramelo)}
.lead{font:italic 600 26px/1.15 var(--f-display);color:var(--cacao);margin:10px 0 14px}
h2{font-family:var(--f-display);font-weight:700;font-size:24px}
h3{color:var(--caramelo);letter-spacing:.09em}
.tile{border-radius:18px;border-color:var(--line);box-shadow:0 1px 0 rgba(67,48,46,.06)}
.tile .tn{font-family:var(--f-display);font-weight:700;font-size:21px}
.tile.sabor{background:repeating-linear-gradient(90deg,var(--salvia) 0 18px,#CBCCA3 18px 26px);border-color:var(--salvia);color:var(--cacao)}
.tile.sabor .tn{font-size:23px}
.tile.sabor .ts{color:var(--cacao);opacity:.85}
.tile.add{background:transparent;color:var(--caramelo);border-color:var(--salvia)}
.pill{background:transparent;color:var(--cacao);border:2px solid var(--caramelo);padding:1px 9px}
.btn{border-radius:99px}
.btn.pri{background:var(--caramelo);border-color:var(--caramelo);color:var(--crema)}
.btn.big{font-family:var(--f-body);font-weight:700;letter-spacing:.01em}
.photo{color:var(--caramelo);border-color:var(--salvia);background:var(--surface)}
input,select,textarea{background:var(--surface);border-color:var(--line)}
input:focus,select:focus,textarea:focus{border-color:var(--caramelo);outline:none;box-shadow:0 0 0 3px rgba(132,89,43,.18)}
.lotrow{background:var(--surface)}
.lotrow .ln{font-family:var(--f-display);font-size:18px}
.mh h2{font-style:italic;font-weight:600;font-size:26px}
.bar{background:var(--mantequilla);border:1px solid #EFE2A8}
.card{border-color:var(--line)}
details.more summary{color:var(--caramelo)}
nav{background:var(--crema);border-top:1px solid var(--line)}
nav button{color:var(--muted)}
nav button.on{color:var(--caramelo)}
nav button.on svg{stroke-width:2.2}
.sheet{background:var(--crema)}
.close{background:var(--mantequilla);color:var(--cacao)}
.toast{background:var(--cacao);color:var(--crema)}
.check input{accent-color:var(--caramelo)}
.chips input{accent-color:var(--caramelo)}
button:focus-visible,summary:focus-visible{outline-color:var(--caramelo)}

.hbtns{display:flex;gap:8px;flex:none}
.icon-btn{position:relative}
.badge{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--bad);color:#fff;font:700 12px/20px var(--f-body);text-align:center}
button.bar{width:100%;text-align:left;font:inherit;color:var(--ink);cursor:pointer}
.bar.badbar{background:var(--bad-soft);border-color:#EBC3BA}
.card.doc{position:relative;min-height:66px;padding-right:62px}
.card.aviso{border-left:5px solid var(--warn)}
.card.aviso.bad{border-left-color:var(--bad)}
.card .row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.card .row>span{min-width:0}
details.dia{border:1px solid var(--line);border-radius:14px;background:var(--surface);margin-bottom:8px;padding:0 12px}
details.dia summary{min-height:52px;display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer;font-weight:600;list-style:none}
details.dia summary>span:first-child{display:inline-block}
details.dia summary>span:first-child::first-letter{text-transform:uppercase}
details.dia summary::-webkit-details-marker{display:none}
details.dia[open]{padding-bottom:4px}
details.dia .card{background:var(--crema)}
select#dia{font-weight:600;text-transform:none}
nav button{font-size:11px}
.row-add{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;margin-top:12px}
.tile.add{min-height:64px}
.diarow{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.diarow label{margin:0;font-size:15px}
.diarow input{max-width:210px}
.card.sabores{padding:2px 14px}
.srow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.srow:last-child{border-bottom:0}
.srow .sinfo{min-width:0}
.srow .sinfo b{font-family:var(--f-display);font-size:20px;line-height:1.2}
.srow.on .step output{color:var(--caramelo)}
.srow .step{flex:none}
.srow .step button{width:46px;height:46px;border-radius:23px;border-color:var(--salvia)}
button.link{border:0;background:none;padding:0;min-height:0;color:var(--caramelo);font:600 14px var(--f-body);text-decoration:underline;cursor:pointer}
.btn:disabled{opacity:.55;cursor:default}
.priv{background:var(--mantequilla);border-radius:12px;padding:10px 12px;font-size:14px}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.kpi b{display:block;font:700 28px/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--muted)}
.card.top{margin-top:10px;background:var(--surface)}
.top-n{font:italic 600 24px/1.2 var(--f-display);color:var(--caramelo)}
.hbars{display:flex;flex-direction:column;gap:10px}
.hb{display:grid;grid-template-columns:minmax(0,1fr);gap:4px}
.hb-l{font-weight:600;font-size:15px;overflow-wrap:anywhere}
.hb-t{height:14px;background:var(--mantequilla);border-radius:7px;overflow:hidden}
.hb-f{height:100%;background:var(--caramelo);border-radius:0 7px 7px 0}
.hb-v{font-size:14px;font-variant-numeric:tabular-nums}
.vbars{display:flex;align-items:flex-end;gap:6px;height:170px;padding-top:4px}
.vb{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;height:100%}
.vb-v{font-size:12px;font-variant-numeric:tabular-nums;height:16px;color:var(--ink)}
.vb-c{flex:1;width:100%;max-width:34px;display:flex;align-items:flex-end;border-bottom:1px solid var(--line)}
.vb-f{width:100%;background:var(--caramelo);border-radius:4px 4px 0 0}
.vb-l{font-size:11px;color:var(--muted);margin-top:4px;white-space:nowrap}
.al-t td,.al-t th{text-align:center}.al-t td:first-child,.al-t th:first-child{text-align:left;white-space:normal;min-width:120px}
.al-si{color:var(--caramelo);font-weight:800}
</style>
</head>

<script>
'use strict';
/* ===== Utilidades ===== */
const $=(s,r)=>(r||document).querySelector(s);
const $$=(s,r)=>Array.from((r||document).querySelectorAll(s));
const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>(n<10?'0':'')+n;
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>iso(new Date());
const nowHM=()=>{const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const MESES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const MES3=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const fdate=s=>{if(!s)return '—';const p=s.split('-');return p[2]+'/'+p[1]+'/'+p[0]};
const fshort=s=>{if(!s)return '—';const p=s.split('-');return (+p[2])+' '+MES3[+p[1]-1]};
const monthName=k=>{const p=k.split('-');return MESES[+p[1]-1]+' '+p[0]};
const num=v=>{const n=parseFloat(String(v).replace(',','.'));return isNaN(n)?null:n};
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').trim();
const daysBetween=(a,b)=>{const x=a.split('-'),y=b.split('-');return Math.round((new Date(+y[0],+y[1]-1,+y[2])-new Date(+x[0],+x[1]-1,+x[2]))/864e5)};
let toastT;
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{t.hidden=true},2600)}
function sheet(html,onClose){const d=$('#dlg');$('#sheet').innerHTML='<div class="grip"><span></span></div><button class="close" id="x" aria-label="Cerrar">×</button>'+html;
  $('#sheet').scrollTop=0;if(!d.open){try{d.showModal()}catch(e){d.setAttribute('open','')}}$('#x').onclick=closeSheet}
function closeSheet(){const d=$('#dlg');try{d.close()}catch(e){d.removeAttribute('open')}}
$('#dlg').addEventListener('click',e=>{if(e.target===e.currentTarget)closeSheet()});
$('#dlg').addEventListener('close',()=>render());
function confirmBtn(btn,label,fn){btn.addEventListener('click',()=>{if(!btn.dataset.sure){btn.dataset.sure='1';btn.textContent=label;return}fn()})}

/* ===== Almacén local: todo se guarda solo en este móvil ===== */
const CLOUD=false;const DBN='obrador-sencillo';let idb=null,persistOk=true;
const M={cfg:null,e:{},t:{},c:{},l:{},d:{}};const fotoMem={};
function openDb(){return new Promise((res,rej)=>{if(!window.indexedDB){rej(new Error('sin almacenamiento'));return}
  const r=indexedDB.open(DBN,2);r.onupgradeneeded=()=>{const d=r.result;['kv','fotos','snap'].forEach(n=>{if(!d.objectStoreNames.contains(n))d.createObjectStore(n)})};
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function tx(store,fn){if(!idb)return Promise.resolve();return new Promise((res,rej)=>{const t=idb.transaction(store,'readwrite');fn(t.objectStore(store));
  t.oncomplete=()=>res();t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})}
function readAll(store){if(!idb)return Promise.resolve(store==='fotos'?Object.assign({},fotoMem):{});
  return new Promise((res,rej)=>{const out={},rq=idb.transaction(store).objectStore(store).openCursor();
  rq.onsuccess=()=>{const c=rq.result;if(c){out[c.key]=c.value;c.continue()}else res(out)};rq.onerror=()=>rej(rq.error)})}
function getFoto(id){if(fotoMem[id]||!idb)return Promise.resolve(fotoMem[id]||null);
  return new Promise(res=>{const rq=idb.transaction('fotos').objectStore('fotos').get(id);rq.onsuccess=()=>{if(rq.result)fotoMem[id]=rq.result;res(rq.result||null)};rq.onerror=()=>res(null)})}
function failSave(e){console.error(e);toast('No se pudo guardar en el móvil');throw e}
function marcaCambio(){try{localStorage.setItem('os_cambio',String(Date.now()))}catch(e){}}
function saveRec(kind,o){marcaCambio();M[kind][o.id]=o;return tx('kv',s=>s.put(o,kind+':'+o.id)).catch(failSave)}
function delRec(kind,id){marcaCambio();delete M[kind][id];return tx('kv',s=>s.delete(kind+':'+id)).catch(failSave)}
function saveCfg(c){marcaCambio();M.cfg=c;return tx('kv',s=>s.put(c,'cfg')).catch(failSave)}
function saveFoto(id,d){fotoMem[id]=d;return tx('fotos',s=>s.put(d,id)).catch(failSave)}
function delFoto(id){delete fotoMem[id];return tx('fotos',s=>s.delete(id)).catch(()=>{})}
function defCfg(){return {negocio:'Puro Umami Cheesecake',ingredientes:['Queso crema','Nata','Huevos','Azúcar','Galletas','Mantequilla'],
  sabores:[{id:'s1',nombre:'Tarta de queso',ings:['Queso crema','Nata','Huevos','Azúcar'],horno:'',min:''},
           {id:'s2',nombre:'Tarta de queso con galleta',ings:['Queso crema','Nata','Huevos','Azúcar','Galletas','Mantequilla'],horno:'',min:''}],
  camaras:[{id:'c1',nombre:'Cámara',min:0,max:4}],horaAviso:'16:00',
  limpieza:['Mesas y superficies','Utensilios y moldes','Suelo','Cámara por dentro (una vez por semana)']}}
function load(){
  return openDb().then(d=>{idb=d;return readAll('kv')}).then(o=>{Object.keys(o).forEach(k=>{if(k==='cfg'){M.cfg=o[k];return}
      const i=k.indexOf(':'),kind=k.slice(0,i),id=k.slice(i+1);if(M[kind])M[kind][id]=o[k]})})
    .catch(e=>{console.error(e);persistOk=false;idb=null})
    .then(()=>{if(!M.cfg){M.cfg=defCfg();return saveCfg(M.cfg).catch(()=>{})}})
    .then(()=>{try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}})}

/* ===== Datos ===== */
const entradasDe=ing=>Object.values(M.e).filter(e=>norm(e.ing)===norm(ing)).sort((a,b)=>a.fecha===b.fecha?b.ts-a.ts:(a.fecha<b.fecha?1:-1));
function loteActual(ing,fecha){const l=entradasDe(ing);return l.find(e=>e.fecha<=fecha)||l[0]||null}
const tartasOrden=()=>Object.values(M.t).sort((a,b)=>a.fecha===b.fecha?b.ts-a.ts:(a.fecha<b.fecha?1:-1));
function compress(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),img=new Image();
  img.onload=()=>{const m=1100,s=Math.min(1,m/Math.max(img.width,img.height)),c=document.createElement('canvas');
    c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',0.72))};
  img.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('foto'))};img.src=u})}
function fillThumbs(root){$$('img[data-foto]',root).forEach(img=>getFoto(img.dataset.foto).then(d=>{if(d)img.src=d;else img.remove()}))}
function shareFile(name,text,type){
  const blob=new Blob([text],{type:type});
  try{const f=new File([blob],name,{type:type});if(navigator.canShare&&navigator.canShare({files:[f]}))return navigator.share({files:[f],title:name}).then(()=>true,e=>{if(e&&e.name!=='AbortError')throw e;return false})}catch(e){}
  const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(u);a.remove()},4000);return Promise.resolve(true)}

/* ===== Entradas ===== */
const CAM='<svg width="34" height="34" viewBox="0 0 24 24"><path d="M3 8h3l2-3h8l2 3h3v11H3z"/><circle cx="12" cy="13" r="4"/></svg>';
function vEntradas(){
  const c=M.cfg,t=today();
  let h=avisoCopia()+'<p class="lead">¿Qué te ha llegado?</p><div class="tiles">';
  c.ingredientes.forEach(ing=>{const e=loteActual(ing,t);
    h+='<button class="tile" data-act="entrada" data-ing="'+esc(ing)+'"><span class="tn">'+esc(ing)+'</span>'+
      (e?'<span class="tl">Lote <span class="code">'+esc(e.lote||'en la foto')+'</span></span><span class="ts">'+(e.marca?esc(e.marca)+' · ':'')+'entró el '+fshort(e.fecha)+'</span>':'<span class="tl warn">Sin lote todavía</span>')+
      (e&&e.foto?'<img class="thumb" data-foto="'+esc(e.id)+'" alt="">':'')+'</button>'});
  h+='<button class="tile add" data-act="ing-nuevo">+ Añadir ingrediente</button></div>';
  const ult=Object.values(M.e).sort((a,b)=>b.ts-a.ts).slice(0,6);
  if(ult.length){h+='<h3>Últimas entradas</h3>';ult.forEach(e=>{h+=cardEntrada(e)})}
  else h+='<div class="empty" style="margin-top:14px"><b>Empieza por aquí</b>Cuando te llegue el queso, la nata o los huevos, toca su botón, hazle una foto al lote y guarda.</div>';
  return h}
function cardEntrada(e){return '<button class="card" data-act="ver-entrada" data-id="'+esc(e.id)+'"><div class="th"><b>'+esc(e.ing)+'</b><span class="pill">'+fshort(e.fecha)+'</span></div>'+
  '<div class="small">Lote <span class="code">'+esc(e.lote||'en la foto')+'</span>'+(e.marca?' · '+esc(e.marca):'')+(e.cad?' · <span class="muted">cad. '+fdate(e.cad)+'</span>':'')+'</div></button>'}
function formEntrada(ing,edit,after){
  const e=edit||{},prev=entradasDe(ing)[0];let foto=null;const tenia=!!e.foto;
  const marcas=[...new Set(entradasDe(ing).map(x=>x.marca).filter(Boolean))];
  sheet('<h2>'+(edit?'Editar entrada de ':'Ha llegado: ')+esc(ing)+'</h2>'+
   '<button type="button" class="photo" id="ph-btn"><span id="ph-txt" style="display:flex;flex-direction:column;align-items:center;gap:8px;padding:20px">'+CAM+'Hacer foto al lote y la fecha</span><img id="ph-img" hidden alt="Foto del lote"></button>'+
   '<label for="en-lote">Número de lote</label><input id="en-lote" class="lote" value="'+esc(e.lote||'')+'" autocapitalize="characters" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="Ej. L2611A">'+
   '<div class="hint" id="en-hint">'+(CLOUD?'Al hacer la foto, la app lee el lote, la caducidad y la marca. Revisa que estén bien.':'Escríbelo mirando la foto. También puedes tocar el campo y usar «Escanear texto» del iPhone.')+'</div>'+
   '<label for="en-marca">Marca</label><input id="en-marca" list="dl-m" value="'+esc(e.marca!=null?e.marca:(prev&&prev.marca)||'')+'" placeholder="Ej. la marca del queso"><datalist id="dl-m">'+marcas.map(m=>'<option value="'+esc(m)+'">').join('')+'</datalist>'+
   '<div class="two"><div><label for="en-f">Día que entra</label><input id="en-f" type="date" value="'+(e.fecha||today())+'"></div>'+
   '<div><label for="en-c">Caducidad <span style="font-weight:400">(opcional)</span></label><input id="en-c" type="date" value="'+(e.cad||'')+'"></div></div>'+
   (edit?'':'<button type="button" class="btn full" id="fac-btn" style="margin-top:16px">+ Foto de la factura o albarán</button><img id="fac-img" class="bigphoto" hidden alt="Factura">')+
   '<button class="btn pri big" id="en-save">Guardar</button>'+(edit?'<button class="btn danger full" id="en-del" style="margin-top:10px">Borrar esta entrada</button>':''));
  const show=d=>{$('#ph-img').src=d;$('#ph-img').hidden=false;$('#ph-txt').innerHTML='<span class="again">Toca para repetir la foto</span>';$('#ph-txt').style.padding='0';$('#ph-btn').classList.add('has');$('#ph-btn').appendChild($('#ph-txt'))};
  if(tenia)getFoto(e.id).then(d=>{if(d)show(d)});
  $('#ph-btn').onclick=()=>{const inp=$('#ph-in');inp.value='';inp.onchange=()=>{const f=inp.files&&inp.files[0];if(!f)return;
    compress(f).then(d=>{foto=d;show(d);if(CLOUD)autoLote(d);else if(!$('#en-lote').value)$('#en-lote').focus()}).catch(()=>toast('No se pudo usar esa foto'))};inp.click()};
  let factura=null;
  if($('#fac-btn'))$('#fac-btn').onclick=()=>pickPhoto(d=>{factura=d;$('#fac-img').src=d;$('#fac-img').hidden=false;$('#fac-btn').textContent='Repetir foto de la factura'});
  $('#en-save').onclick=()=>{
    const lote=$('#en-lote').value.trim().toUpperCase();
    if(!lote&&!foto&&!tenia){toast('Haz la foto o escribe el número de lote');return}
    const o={id:e.id||uid(),ing:ing,lote:lote,marca:$('#en-marca').value.trim(),fecha:$('#en-f').value||today(),cad:$('#en-c').value,foto:!!(foto||tenia),ts:e.ts||Date.now()};
    (foto?saveFoto(o.id,foto):Promise.resolve()).then(()=>saveRec('e',o))
     .then(()=>{if(!factura)return;const dc={id:uid(),tipo:'Factura',nombre:ing+(o.marca?' · '+o.marca:''),fecha:o.fecha,vence:'',eid:o.id,ts:Date.now()};
       return saveFoto('doc_'+dc.id,factura).then(()=>saveRec('d',dc))}).then(()=>{toast('Guardado: '+ing+(lote?' · lote '+lote:''));closeSheet();if(after)setTimeout(after,50)}).catch(()=>{})};
  if(edit)confirmBtn($('#en-del'),'Pulsa otra vez para borrar',()=>{delRec('e',e.id).then(()=>{delFoto(e.id);closeSheet();toast('Entrada borrada')})})}
function verEntrada(id){const e=M.e[id];if(!e)return;
  const usos=tartasOrden().filter(t=>t.ings.some(i=>i.eid===e.id));
  sheet('<h2>'+esc(e.ing)+'</h2>'+(e.foto?'<img class="bigphoto" data-foto="'+esc(e.id)+'" alt="Foto del lote">':'')+
   '<div class="lots"><span class="k">Lote</span><span class="code">'+esc(e.lote||'en la foto')+'</span><span class="k">Marca</span><span>'+esc(e.marca||'—')+'</span>'+
   '<span class="k">Entró</span><span>'+fdate(e.fecha)+'</span><span class="k">Caducidad</span><span>'+fdate(e.cad)+'</span></div>'+
   '<h3>Tartas hechas con este lote</h3>'+(usos.length?usos.map(t=>'<div class="small">'+fdate(t.fecha)+' · '+esc(t.sabor)+' · '+t.uds+' ud.</div>').join(''):'<div class="small muted">Todavía ninguna.</div>')+
   '<button class="btn full" id="ve-ed" style="margin-top:18px">Editar</button>');
  fillThumbs($('#sheet'));$('#ve-ed').onclick=()=>formEntrada(e.ing,e)}

/* ===== Tartas ===== */
function vTartas(){
  const c=M.cfg,t=today();
  if(!diaReg)diaReg=t;
  const total=c.sabores.reduce((a,s)=>a+(cnt[s.id]||0),0);
  let h=avisoCopia()+'<p class="lead">¿Cuántas has hecho?</p>'+
   '<div class="diarow"><label for="tr-f">Día</label><input id="tr-f" type="date" value="'+diaReg+'"></div>'+
   '<div class="card sabores">'+(c.sabores.length?c.sabores.map(s=>{const n=cnt[s.id]||0,
      ya=Object.values(M.t).filter(x=>x.fecha===diaReg&&x.saborId===s.id).reduce((a,x)=>a+(+x.uds||0),0),falta=s.ings.filter(i=>!loteActual(i,diaReg));
    return '<div class="srow'+(n?' on':'')+'"><div class="sinfo"><b>'+esc(s.nombre)+'</b>'+
      '<div class="small muted">'+(ya?'Ya guardadas ese día: '+ya+' · ':'')+'<button type="button" class="link" data-act="tarta" data-id="'+esc(s.id)+'">Ver lotes</button> · <button type="button" class="link" data-act="sabor-editar" data-id="'+esc(s.id)+'">Ingredientes</button></div>'+
      (falta.length?'<div class="small warn">Falta el lote de '+esc(falta.join(', '))+'</div>':'')+'</div>'+
      '<div class="step"><button type="button" data-step="-1" data-id="'+esc(s.id)+'" aria-label="Una menos de '+esc(s.nombre)+'">−</button><output>'+n+'</output>'+
      '<button type="button" data-step="1" data-id="'+esc(s.id)+'" aria-label="Una más de '+esc(s.nombre)+'">+</button></div></div>'}).join(''):'<div class="small muted" style="padding:12px 0">Añade tu primer sabor.</div>')+'</div>'+
   '<button class="btn pri big" id="tr-save"'+(total?'':' disabled')+'>'+(total?'Guardar '+total+' tarta'+(total===1?'':'s'):'Pulsa + en las que has hecho')+'</button>'+
   '<button class="tile add" data-act="sabor-nuevo" style="width:100%;margin-top:12px">+ Añadir sabor</button>';
  const dias=[...new Set(Object.values(M.t).map(x=>x.fecha))];if(!dias.includes(t))dias.push(t);dias.sort().reverse();
  if(!diaSel||!dias.includes(diaSel))diaSel=t;
  h+='<button class="btn full" data-act="alergenos" style="margin-top:10px">Tabla de alérgenos</button>';
  h+='<h3>Tartas hechas el día</h3><select id="dia" aria-label="Elegir día">'+dias.slice(0,120).map(d=>{const n=udsDia(d);
    return '<option value="'+d+'"'+(d===diaSel?' selected':'')+'>'+diaLabel(d)+' · '+n+' tarta'+(n===1?'':'s')+'</option>'}).join('')+'</select><div id="dia-l" style="margin-top:10px">'+listaDia(diaSel)+'</div>';
  return h}
let diaSel='',diaReg='',cnt={};
function guardarCuenta(){
  const c=M.cfg,f=diaReg||today(),lista=c.sabores.filter(s=>cnt[s.id]>0);if(!lista.length)return;
  const ps=lista.map(s=>saveRec('t',{id:uid(),saborId:s.id,sabor:s.nombre,fecha:f,uds:cnt[s.id],
    ings:s.ings.map(ing=>{const e=loteActual(ing,f);return e?{ing:ing,lote:e.lote||'',marca:e.marca||'',eid:e.id}:{ing:ing,lote:'',marca:'',eid:''}}),
    horno:num(s.horno),min:num(s.min),nota:'',lote:loteJuliano(f),cad:sumarDias(f,vidaDe(s)),alergenos:(s.alergenos||[]).slice(),ts:Date.now()}));
  const txt=lista.map(s=>cnt[s.id]+' '+s.nombre).join(', ');
  Promise.all(ps).then(()=>{cnt={};diaSel=f;toast('Guardado: '+txt);render()}).catch(()=>{})}
const WD=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
function diaLabel(d){const t=today();if(d===t)return 'Hoy';const y=new Date();y.setDate(y.getDate()-1);if(d===iso(y))return 'Ayer';
  const p=d.split('-');return WD[new Date(+p[0],+p[1]-1,+p[2]).getDay()]+' '+fshort(d)}
const udsDia=d=>Object.values(M.t).filter(x=>x.fecha===d).reduce((a,x)=>a+(+x.uds||0),0);
function listaDia(d){const l=tartasOrden().filter(x=>x.fecha===d);
  if(!l.length)return '<div class="small muted">Ese día no registraste ninguna tarta.</div>';
  const res={};l.forEach(x=>{res[x.sabor]=(res[x.sabor]||0)+(+x.uds||0)});
  return '<div class="small" style="margin-bottom:8px">'+Object.keys(res).map(k=>'<b>'+res[k]+'</b> '+esc(k)).join(' · ')+'</div>'+l.map(cardTarta).join('')}
function cardTarta(t){
  return '<button class="card" data-act="ver-tarta" data-id="'+esc(t.id)+'"><div class="th"><b>'+fshort(t.fecha)+' · '+esc(t.sabor)+'</b><span class="pill">'+t.uds+' ud.</span></div>'+(t.lote?'<div class="small" style="margin:-2px 0 6px">Lote <span class="code">'+esc(t.lote)+'</span>'+(t.cad?' · consumir antes del '+fdate(t.cad):'')+'</div>':'')+'<div class="lots">'+
   t.ings.map(i=>'<span class="k">'+esc(i.ing)+'</span><span>'+(i.lote?'<span class="code">'+esc(i.lote)+'</span>':(i.eid?'<span class="muted">en la foto</span>':'<span class="warn">sin lote</span>'))+(i.marca?' <span class="muted">'+esc(i.marca)+'</span>':'')+'</span>').join('')+'</div></button>'}
function formTarta(sid){
  const s=M.cfg.sabores.find(x=>x.id===sid);if(!s)return;let uds=1;const sel={};
  sheet('<h2>'+esc(s.nombre)+'</h2><div class="two"><div><label for="ta-f">Día que la haces</label><input id="ta-f" type="date" value="'+today()+'"></div>'+
   '<div><label>Cuántas</label><div class="step"><button type="button" id="ta-m" aria-label="Menos">−</button><output id="ta-u">1</output><button type="button" id="ta-p" aria-label="Más">+</button></div></div></div>'+
   '<h3>Se guardará con estos lotes</h3><div id="ta-ings"></div>'+
   '<details class="more"><summary>Horno y notas (opcional)</summary><div class="two"><div><label for="ta-h">Horno (°C)</label><input id="ta-h" inputmode="numeric" value="'+esc(s.horno||'')+'"></div>'+
   '<div><label for="ta-mi">Minutos</label><input id="ta-mi" inputmode="numeric" value="'+esc(s.min||'')+'"></div></div><label for="ta-n">Notas</label><input id="ta-n"></details>'+
   '<button class="btn pri big" id="ta-save">Guardar tarta</button>');
  function elegido(ing){const f=$('#ta-f').value||today();return (sel[ing]&&M.e[sel[ing]])||loteActual(ing,f)}
  function dibujar(){
    $('#ta-ings').innerHTML=s.ings.map(ing=>{const e=elegido(ing),ops=entradasDe(ing).slice(0,8);
      if(!e)return '<div class="lotrow missing"><div class="ln">'+esc(ing)+'</div><div class="small">No hay ningún lote registrado.</div><button type="button" class="btn sm" style="margin-top:8px" data-addent="'+esc(ing)+'">Registrar entrada de '+esc(ing)+'</button></div>';
      return '<div class="lotrow"><div class="ln">'+esc(ing)+'</div><div class="small">Lote <span class="code">'+esc(e.lote||'en la foto')+'</span>'+(e.marca?' · '+esc(e.marca):'')+' · entró el '+fshort(e.fecha)+'</div>'+

function limpiarCopia(o){const N=v=>{const n=Number(v);return isFinite(n)?n:0},Nn=v=>v==null||v===''?null:N(v),obj=v=>v&&typeof v==='object'&&!Array.isArray(v)?v:{};
  ['e','t','c','l','d','fotos'].forEach(k=>{o[k]=obj(o[k])});

  const F8=/^\d{4}-\d{2}-\d{2}$/;['e','t','c','l','d'].forEach(k=>Object.keys(o[k]).forEach(id=>{const r=o[k][id];if(!r||typeof r!=='object'||!F8.test(String(r.fecha))){delete o[k][id];return}['cad','vence'].forEach(f=>{if(r[f]!=null&&r[f]!==''&&!F8.test(String(r[f])))r[f]=''});if(r.lote!=null)r.lote=String(r.lote);if(k==='t'&&Array.isArray(r.alergenos))r.alergenos=r.alergenos.map(String).filter(a=>ALERG.includes(a))}));
  c.camaras=(Array.isArray(c.camaras)?c.camaras:[]).map(x=>({id:String(x.id),nombre:String(x.nombre||''),min:N(x.min),max:N(x.max)}));
  Object.values(o.c).forEach(r=>{r.v=N(r.v);r.ok=!!r.ok});Object.values(o.l).forEach(r=>{r.i=N(r.i)});
  Object.values(o.t).forEach(t=>{t.uds=N(t.uds);t.horno=Nn(t.horno);t.min=Nn(t.min);if(!Array.isArray(t.ings))t.ings=[]});

function avisos(){
  const A=[],t=today(),c=M.cfg;if(!c)return A;
  if(!persistOk)A.push({k:'bad',t:'Los datos no se están guardando',s:CLOUD?'Abre la app con tu cuenta de Claude y con conexión.':'Abre la app desde su icono de la pantalla de inicio.'});

  const faltan=c.camaras.filter(x=>!M.c[t+'_'+x.id]);
  if(faltan.length)A.push({k:'warn',t:'Falta la temperatura de hoy',s:faltan.map(x=>x.nombre).join(', '),tab:'camara',b:'Anotar'});
  const mal=c.camaras.map(x=>M.c[t+'_'+x.id]).filter(r=>r&&!r.ok);
  if(mal.length)A.push({k:'bad',t:'Temperatura fuera de 0–4 °C hoy',s:mal.map(r=>r.camNombre+' '+r.v+' °C').join(', '),tab:'camara',b:'Ver'});
  const diarias=c.limpieza.map((x,i)=>({x:x,i:i})).filter(o=>!/seman/i.test(o.x)),sin=diarias.filter(o=>!M.l[t+'_'+o.i]).length;
  if(sin)A.push({k:'warn',t:'Limpieza de hoy sin marcar',s:sin+' de '+diarias.length+' tareas',tab:'camara',b:'Marcar'});
  c.limpieza.forEach((x,i)=>{if(!/seman/i.test(x))return;if(!Object.values(M.l).some(r=>r.i===i&&daysBetween(r.fecha,t)<7))A.push({k:'warn',t:'Limpieza semanal pendiente',s:x,tab:'camara',b:'Marcar'})});
  Object.values(M.d).forEach(d=>{const st=docEstado(d);if(st)A.push({k:st,t:(st==='bad'?'Documento caducado: ':'Caduca pronto: ')+d.tipo,s:(d.nombre?d.nombre+' · ':'')+fdate(d.vence),doc:d.id,b:'Ver'})});
  c.ingredientes.forEach(ing=>{const e=loteActual(ing,t);if(!e||!e.cad)return;const n=daysBetween(t,e.cad);
    if(n<0)A.push({k:'bad',t:ing+' caducado',s:'Lote '+(e.lote||'en la foto')+' · caducó el '+fdate(e.cad),ent:e.id,b:'Ver'});

  return A.sort((a,b)=>a.k===b.k?0:(a.k==='bad'?-1:1))}

/* ===== Calendario del iPhone (.ics) ===== */
const icsEsc=s=>String(s).replace(/[\\;,]/g,m=>'\\'+m).replace(/\n/g,'\\n');
const icsStamp=()=>new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
function addDay(s){const p=s.split('-'),d=new Date(+p[0],+p[1]-1,+p[2]+1);return iso(d)}
function icsDiario(h){const hm=h.replace(':','');return ['BEGIN:VEVENT','UID:diario-'+uid()+'@puroumami','DTSTAMP:'+icsStamp(),'DTSTART:'+today().replace(/-/g,'')+'T'+hm+'00','DURATION:PT10M','RRULE:FREQ=DAILY',
  'SUMMARY:'+icsEsc('Puro Umami: temperatura, limpieza y copia'),'DESCRIPTION:'+icsEsc('Abre la app, anota la temperatura y la limpieza de hoy y guarda la copia.'),
  'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc('Anota la temperatura, la limpieza y guarda la copia'),'TRIGGER:PT0M','END:VALARM','END:VEVENT']}
function icsDoc(d){return ['BEGIN:VEVENT','UID:doc-'+d.id+'@puroumami','DTSTAMP:'+icsStamp(),'DTSTART;VALUE=DATE:'+d.vence.replace(/-/g,''),'DTEND;VALUE=DATE:'+addDay(d.vence).replace(/-/g,''),
  'SUMMARY:'+icsEsc('Caduca: '+d.tipo+(d.nombre?' ('+d.nombre+')':'')),
  'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc('Renueva '+d.tipo+' (caduca en una semana)'),'TRIGGER:-P6DT15H','END:VALARM',
  'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc('Hoy caduca '+d.tipo),'TRIGGER:PT9H','END:VALARM','END:VEVENT']}
function bajarIcs(name,events){const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Puro Umami//Obrador//ES','CALSCALE:GREGORIAN','METHOD:PUBLISH'];
  events.forEach(e=>L.push.apply(L,e));L.push('END:VCALENDAR');
  const blob=new Blob([L.join('\r\n')+'\r\n'],{type:'text/calendar'}),u=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=u;a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(u);a.remove()},5000);
  toast('Abre el archivo y pulsa «Añadir» para guardarlo en el calendario')}

/* ===== Copias automáticas diarias dentro del móvil ===== */
const snapOk=()=>!!(idb&&idb.objectStoreNames.contains('snap'));
function snapKeys(){return new Promise(res=>{if(!snapOk()){res([]);return}const rq=idb.transaction('snap').objectStore('snap').getAllKeys();
  rq.onsuccess=()=>res(rq.result.map(String).sort().reverse());rq.onerror=()=>res([])})}
function autoSnap(){if(!snapOk())return Promise.resolve();const t=today();
  return snapKeys().then(keys=>{if(keys.includes(t))return;if(!Object.keys(M.e).length&&!Object.keys(M.t).length&&!Object.keys(M.d).length)return;
    const lim=new Date();lim.setDate(lim.getDate()-14);const corte=iso(lim);
    const v=JSON.parse(JSON.stringify({at:Date.now(),cfg:M.cfg,e:M.e,t:M.t,c:M.c,l:M.l,d:M.d}));
    return tx('snap',s=>{s.put(v,t);keys.filter(k=>k<corte).forEach(k=>s.delete(k))})}).catch(e=>console.error(e))}
function fillSnaps(){const box=$('#snaps');if(!box)return;

/* ===== Mis estadísticas (privadas: solo salen del móvil si tú lo eliges en el informe) ===== */
const WD_CORTO=['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
function rangoStats(r){const t=today();
  if(r==='mes')return [t.slice(0,8)+'01',t];
  if(r==='pasado'){const p=sumarMeses(t.slice(0,8)+'01',-1);return [p,sumarDias(t.slice(0,8)+'01',-1)]}
  if(r==='3m')return [sumarMeses(t,-3),t];
  if(r==='anio')return [t.slice(0,4)+'-01-01',t];
  const fs=Object.values(M.t).map(x=>x.fecha).sort();return [fs[0]||t,t]}
function datosStats(d,h){
  const T=Object.values(M.t).filter(x=>x.fecha>=d&&x.fecha<=h),total=T.reduce((a,x)=>a+(+x.uds||0),0);
  const dias=new Set(T.map(x=>x.fecha)).size,ps={};T.forEach(x=>{ps[x.sabor]=(ps[x.sabor]||0)+(+x.uds||0)});
  const porSabor=Object.keys(ps).map(k=>({k:k,v:ps[k]})).sort((a,b)=>b.v-a.v);
  const pm={};T.forEach(x=>{const k=x.fecha.slice(0,7);pm[k]=(pm[k]||0)+(+x.uds||0)});
  const meses=[];let k=h.slice(0,7);for(let i=0;i<12;i++){meses.unshift(k);if(k<=d.slice(0,7))break;const p=k.split('-');const dt=new Date(+p[0],+p[1]-2,1);k=dt.getFullYear()+'-'+pad(dt.getMonth()+1)}
  const porMes=meses.map(m=>({k:m,v:pm[m]||0}));
  const ws=[0,0,0,0,0,0,0];T.forEach(x=>{const p=x.fecha.split('-');ws[(new Date(+p[0],+p[1]-1,+p[2]).getDay()+6)%7]+=(+x.uds||0)});
  return {total:total,dias:dias,media:dias?total/dias:0,porSabor:porSabor,porMes:porMes,porDia:ws.map((v,i)=>({k:WD_CORTO[i],v:v}))}}
const fmt1=n=>(Math.round(n*10)/10).toString().replace('.',',');
function barrasH(lista){const max=Math.max(1,...lista.map(x=>x.v)),tot=lista.reduce((a,x)=>a+x.v,0)||1;

function barrasV(lista,etq){const max=Math.max(1,...lista.map(x=>x.v));

   '<table style="margin-top:10px"><thead><tr><th>Sabor</th><th>Tartas</th><th>%</th></tr></thead><tbody>'+s.porSabor.map(x=>'<tr><td>'+esc(x.k)+'</td><td>'+x.v+'</td><td>'+Math.round(x.v/s.total*100)+'%</td></tr>').join('')+'</tbody></table></section>'}

/* ===== Alérgenos, lote propio y fichas técnicas ===== */
const ALERG=['Gluten','Crustáceos','Huevo','Pescado','Cacahuetes','Soja','Leche','Frutos de cáscara','Apio','Mostaza','Sésamo','Sulfitos','Altramuces','Moluscos'];
function loteJuliano(f){const p=f.split('-').map(Number),dia=Math.round((Date.UTC(p[0],p[1]-1,p[2])-Date.UTC(p[0],0,1))/864e5)+1;return String(p[0]).slice(-1)+String(dia).padStart(3,'0')}
function vidaDe(s){const v=s&&s.vida!=null?+s.vida:3;return isFinite(v)?v:3}
function htmlAlergenos(sab,completo){
  const cols=completo?ALERG:ALERG.filter(a=>sab.some(s=>(s.alergenos||[]).includes(a)));
  return '<table class="al-t"><thead><tr><th>Tarta</th>'+cols.map(a=>'<th>'+esc(a)+'</th>').join('')+'</tr></thead><tbody>'+
   sab.map(s=>'<tr><td>'+esc(s.nombre)+'</td>'+cols.map(a=>(s.alergenos||[]).includes(a)?'<td class="al-si">Sí</td>':'<td>–</td>').join('')+'</tr>').join('')+'</tbody></table>'}
function tablaAlergenos(){
  const sab=M.cfg.sabores,sin=sab.filter(s=>!(s.alergenos||[]).length),usados=ALERG.filter(a=>sab.some(s=>(s.alergenos||[]).includes(a)));
  sheet('<h2>Tabla de alérgenos</h2>'+(sab.length?'<div class="tbl">'+htmlAlergenos(sab,false)+'</div>'+
   '<div class="small muted" style="margin-top:8px">Ninguna lleva: '+esc(ALERG.filter(a=>!usados.includes(a)).join(', ').toLowerCase())+'.</div>'+
   (sin.length?'<div class="live warn">Sin alérgenos indicados: '+esc(sin.map(s=>s.nombre).join(', '))+'. Márcalos en Tartas › Ingredientes.</div>':'')+
   '<button class="btn pri big" id="al-env">Enviar tabla a un cliente</button><div class="hint">Se envía solo la tabla de alérgenos, sin tus registros ni recetas.</div>'
   :'<div class="empty">Aún no tienes sabores.</div>'));
  if($('#al-env'))$('#al-env').onclick=()=>{const c=M.cfg;
    const html='<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src \'none\'; style-src \'unsafe-inline\'">'+
     '<title>Alérgenos · '+esc(c.negocio||'Puro Umami')+'</title><style>body{margin:0;background:#FFFFEE;color:#43302E;font:15px/1.4 "Avenir Next",Avenir,Arial,sans-serif}.d{max-width:1000px;margin:0 auto;padding:24px 16px}'+
     'h1{font:700 26px Georgia,serif;margin:0 0 4px}.w{overflow-x:auto}table{border-collapse:collapse;background:#fff;font-size:13px}th,td{border:1px solid #E2D9BC;padding:6px 8px;text-align:center}th{background:#FCF2C7}td:first-child,th:first-child{text-align:left;font-weight:700}.al-si{color:#84592B;font-weight:800}p{color:#6b5a50}</style></head><body><div class="d">'+
     '<h1>Información de alérgenos</h1><p>'+esc(c.negocio||'Puro Umami Cheesecake')+' · Actualizada el '+fdate(today())+'</p><div class="w">'+htmlAlergenos(c.sabores,true)+'</div>'+
     '<p>Según el Reglamento (UE) 1169/2011. Si tienes una alergia, consúltanos antes de comprar.</p></div></body></html>';
    shareFile('alergenos-'+norm(c.negocio||'puro umami').replace(/[^a-z0-9]+/g,'-')+'.html',html,'text/html')}}
/* Importar fichas técnicas (archivo que te prepara Claude a partir de tus fichas) */
const normS=x=>norm(x).split(' ').map(w=>w.replace(/s$/,'')).join(' ');
function mismoSabor(a,b){const x=norm(a).replace(/^tarta de queso /,''),y=norm(b).replace(/^tarta de queso /,'');return x===y}
$('#fi-in').addEventListener('change',function(){const f=this.files&&this.files[0];this.value='';if(!f)return;
  const r=new FileReader();r.onload=()=>{let o;try{o=JSON.parse(r.result)}catch(e){toast('Ese archivo no es de fichas técnicas');return}
    if(!o||o.app!=='puro-umami-fichas'||!Array.isArray(o.sabores)){toast('Ese archivo no es de fichas técnicas');return}
    const F=o.sabores.filter(s=>s&&s.nombre).map(s=>({nombre:String(s.nombre).slice(0,80),ingredientes:(Array.isArray(s.ingredientes)?s.ingredientes:[]).map(String).slice(0,40),
      alergenos:(Array.isArray(s.alergenos)?s.alergenos:[]).map(String).filter(a=>ALERG.includes(a)),vida:isFinite(+s.vida)?Math.round(+s.vida):3,conservacion:String(s.conservacion||'0–4 °C'),descripcion:String(s.descripcion||'')}));
    const c=M.cfg,otros=c.sabores.filter(s=>!F.some(x=>mismoSabor(x.nombre,s.nombre)));
    sheet('<h2>Importar fichas técnicas</h2><div class="small muted">Se cargarán estos '+F.length+' sabores con sus ingredientes y alérgenos. Tus lotes, tartas y registros no se tocan.</div>'+
      F.map(s=>'<div class="card" style="margin-top:10px"><b>'+esc(s.nombre)+'</b>'+(c.sabores.some(x=>mismoSabor(x.nombre,s.nombre))?' <span class="pill">se actualiza</span>':' <span class="pill ok">nuevo</span>')+
        '<div class="small"><b>Alérgenos:</b> '+esc(s.alergenos.join(', ')||'ninguno')+'</div><div class="small muted">'+esc(s.ingredientes.join(', '))+'</div><div class="small muted">Consumo preferente: '+s.vida+' días · '+esc(s.conservacion)+'</div></div>').join('')+
      (otros.length?'<h3>Sabores que tienes y no están en las fichas</h3><div class="small muted">Marca los que quieras quitar (las tartas ya guardadas no se borran).</div>'+
        otros.map(s=>'<label class="check"><input type="checkbox" class="fi-q" value="'+esc(s.id)+'"'+(['s1','s2'].includes(s.id)?' checked':'')+'><span>Quitar «'+esc(s.nombre)+'»</span></label>').join(''):'')+
      '<button class="btn pri big" id="fi-ok">Cargar fichas</button>');
    $('#fi-ok').onclick=()=>{const w=JSON.parse(JSON.stringify(c)),quitar=$$('.fi-q:checked').map(x=>x.value);
      const ingNombre=n=>{const e=w.ingredientes.find(x=>normS(x)===normS(n));if(e)return e;w.ingredientes.push(n);return n};
      F.forEach(s=>{const ings=s.ingredientes.map(ingNombre),ex=w.sabores.find(x=>mismoSabor(x.nombre,s.nombre)),
        datos={nombre:s.nombre,ings:ings,alergenos:s.alergenos,vida:s.vida,conservacion:s.conservacion,descripcion:s.descripcion};
        if(ex)Object.assign(ex,datos);else w.sabores.push(Object.assign({id:'s'+uid(),horno:'',min:''},datos))});
      w.sabores=w.sabores.filter(s=>!quitar.includes(s.id));
      saveCfg(w).then(()=>{closeSheet();toast('Fichas cargadas: '+F.length+' sabores')}).catch(()=>{})}};
  r.readAsText(f)});

function autoLote(){}function autoDoc(){}

</script>
