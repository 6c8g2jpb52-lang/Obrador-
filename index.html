/* Layout: logo de Puro Umami arriba sobre la franja de rayas de la marca, una columna, cuatro pestañas abajo. Tema único claro, como el manual de marca. */
:root{
  /* Paleta del manual de marca Puro Umami */
  --cacao:#43302E;--caramelo:#84592B;--mantequilla:#FCF2C7;--crema:#FFFFEE;--salvia:#C2C395;

  --f-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);background:var(--bg)}

  padding:0 max(16px,env(safe-area-inset-right,0px)) calc(92px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
[hidden]{display:none!important}
.wrap{max-width:640px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0 10px}
header h1{font:700 22px/1.2 var(--f-display);margin:0;letter-spacing:-.01em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.icon-btn svg,nav svg,.photo svg{stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.lead{font:600 20px/1.25 var(--f-display);margin:6px 0 12px}

.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{position:relative;text-align:left;min-height:108px;padding:14px;border-radius:16px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;display:flex;flex-direction:column;gap:4px;justify-content:flex-start;min-width:0;cursor:pointer}

.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips label{display:inline-flex;align-items:center;gap:6px;margin:0;font-size:14px;font-weight:500;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:6px 12px;min-height:38px}
.chips input{width:auto;min-height:0;accent-color:var(--accent)}

nav button{flex:1;border:0;background:transparent;color:var(--muted);font:600 12px var(--f-body);padding:9px 2px 8px;min-height:62px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer}

<body>
<div class="wrap">
  <div class="rayas" aria-hidden="true"></div><header><h1 class="marca"><img src="logo.png" alt="Puro Umami Cheesecake" width="441" height="117"><span id="hname" class="sr"></span></h1><div class="hbtns"><button class="icon-btn" id="bell" aria-label="Avisos"><svg width="24" height="24" viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 0112 0v5l2 2H4z"/><path d="M10 20a2 2 0 004 0"/></svg><span class="badge" id="bell-n" hidden></span></button><button class="icon-btn" id="gear" aria-label="Ajustes"><svg width="24" height="24" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg></button></div></header>
  <main id="view"></main>
</div>
<nav aria-label="Secciones">
  <button data-tab="entradas" class="on"><svg viewBox="0 0 24 24"><path d="M3 8l9-5 9 5v8l-9 5-9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg>Entradas</button>
  <button data-tab="tartas"><svg viewBox="0 0 24 24"><path d="M3 18h18M4 18v-5l16-6v11"/><path d="M4 13l16-6"/></svg>Tartas</button>
  <button data-tab="meses"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Meses</button>
  <button data-tab="docs"><svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h7M9 17h7"/></svg>Papeles</button>
  <button data-tab="camara"><svg viewBox="0 0 24 24"><path d="M10 4a2 2 0 014 0v9.2a4 4 0 11-4 0z"/><path d="M12 9v6"/></svg>Cámara</button>
</nav>
<dialog id="dlg"><div class="sheet" id="sheet"></div></dialog>
<div class="toast" id="toast" hidden></div>
<input type="file" id="ph-in" accept="image/*" capture="environment" hidden>
<input type="file" id="bk-in" accept=".json,application/json" hidden>
<input type="file" id="fi-in" accept=".json,application/json" hidden>
<script>
'use strict';
/* ===== Utilidades ===== */
const $=(s,r)=>(r||document).querySelector(s);
const $$=(s,r)=>Array.from((r||document).querySelectorAll(s));
const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>(n<10?'0':'')+n;
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>iso(new Date());
const nowHM=()=>{const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const MESES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const MES3=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const fdate=s=>{if(!s)return '—';const p=s.split('-');return p[2]+'/'+p[1]+'/'+p[0]};
const fshort=s=>{if(!s)return '—';const p=s.split('-');return (+p[2])+' '+MES3[+p[1]-1]};
const monthName=k=>{const p=k.split('-');return MESES[+p[1]-1]+' '+p[0]};
const num=v=>{const n=parseFloat(String(v).replace(',','.'));return isNaN(n)?null:n};
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').trim();
const daysBetween=(a,b)=>{const x=a.split('-'),y=b.split('-');return Math.round((new Date(+y[0],+y[1]-1,+y[2])-new Date(+x[0],+x[1]-1,+x[2]))/864e5)};
let toastT;
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{t.hidden=true},2600)}
function sheet(html,onClose){const d=$('#dlg');$('#sheet').innerHTML='<div class="grip"><span></span></div><button class="close" id="x" aria-label="Cerrar">×</button>'+html;
  $('#sheet').scrollTop=0;if(!d.open){try{d.showModal()}catch(e){d.setAttribute('open','')}}$('#x').onclick=closeSheet}
function closeSheet(){const d=$('#dlg');try{d.close()}catch(e){d.removeAttribute('open')}}
$('#dlg').addEventListener('click',e=>{if(e.target===e.currentTarget)closeSheet()});
$('#dlg').addEventListener('close',()=>render());
function confirmBtn(btn,label,fn){btn.addEventListener('click',()=>{if(!btn.dataset.sure){btn.dataset.sure='1';btn.textContent=label;return}fn()})}

/* ===== Almacén local: todo se guarda solo en este móvil ===== */
const CLOUD=false;const DBN='obrador-sencillo';let idb=null,persistOk=true;
const M={cfg:null,e:{},t:{},c:{},l:{},d:{}};const fotoMem={};
function openDb(){return new Promise((res,rej)=>{if(!window.indexedDB){rej(new Error('sin almacenamiento'));return}
  const r=indexedDB.open(DBN,2);r.onupgradeneeded=()=>{const d=r.result;['kv','fotos','snap'].forEach(n=>{if(!d.objectStoreNames.contains(n))d.createObjectStore(n)})};
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function tx(store,fn){if(!idb)return Promise.resolve();return new Promise((res,rej)=>{const t=idb.transaction(store,'readwrite');fn(t.objectStore(store));
  t.oncomplete=()=>res();t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})}
function readAll(store){if(!idb)return Promise.resolve(store==='fotos'?Object.assign({},fotoMem):{});
  return new Promise((res,rej)=>{const out={},rq=idb.transaction(store).objectStore(store).openCursor();
  rq.onsuccess=()=>{const c=rq.result;if(c){out[c.key]=c.value;c.continue()}else res(out)};rq.onerror=()=>rej(rq.error)})}
function getFoto(id){if(fotoMem[id]||!idb)return Promise.resolve(fotoMem[id]||null);
  return new Promise(res=>{const rq=idb.transaction('fotos').objectStore('fotos').get(id);rq.onsuccess=()=>{if(rq.result)fotoMem[id]=rq.result;res(rq.result||null)};rq.onerror=()=>res(null)})}
function failSave(e){console.error(e);toast('No se pudo guardar en el móvil');throw e}
function marcaCambio(){try{localStorage.setItem('os_cambio',String(Date.now()))}catch(e){}}
function saveRec(kind,o){marcaCambio();M[kind][o.id]=o;return tx('kv',s=>s.put(o,kind+':'+o.id)).then(()=>{typeof syncMarca==='function'&&syncMarca(kind+':'+o.id,'r')}).catch(failSave)}
function delRec(kind,id){marcaCambio();delete M[kind][id];return tx('kv',s=>s.delete(kind+':'+id)).then(()=>{typeof syncMarca==='function'&&syncMarca(kind+':'+id,'r',true)}).catch(failSave)}
function saveCfg(c){marcaCambio();c.ts=Date.now();M.cfg=c;return tx('kv',s=>s.put(c,'cfg')).then(()=>{typeof syncMarca==='function'&&syncMarca('cfg','r')}).catch(failSave)}
function saveFoto(id,d){fotoMem[id]=d;return tx('fotos',s=>s.put(d,id)).then(()=>{typeof syncMarca==='function'&&syncMarca(id,'f')}).catch(failSave)}
function delFoto(id){delete fotoMem[id];return tx('fotos',s=>s.delete(id)).then(()=>{typeof syncMarca==='function'&&syncMarca(id,'f',true)}).catch(()=>{})}
function defCfg(){return {negocio:'Puro Umami Cheesecake',ingredientes:['Queso crema','Nata','Huevos','Azúcar','Galletas','Mantequilla'],
  sabores:[{id:'s1',nombre:'Tarta de queso',ings:['Queso crema','Nata','Huevos','Azúcar'],horno:'',min:''},
           {id:'s2',nombre:'Tarta de queso con galleta',ings:['Queso crema','Nata','Huevos','Azúcar','Galletas','Mantequilla'],horno:'',min:''}],
  camaras:[{id:'c1',nombre:'Cámara',min:0,max:4}],horaAviso:'16:00',
  limpieza:['Mesas y superficies','Utensilios y moldes','Suelo','Cámara por dentro (una vez por semana)']}}
function load(){
  return openDb().then(d=>{idb=d;return readAll('kv')}).then(o=>{Object.keys(o).forEach(k=>{if(k==='cfg'){M.cfg=o[k];return}
      const i=k.indexOf(':'),kind=k.slice(0,i),id=k.slice(i+1);if(M[kind])M[kind][id]=o[k]})})
    .catch(e=>{console.error(e);persistOk=false;idb=null})
    .then(()=>{if(!M.cfg){M.cfg=defCfg();return saveCfg(M.cfg).catch(()=>{})}})
    .then(()=>{try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}})}

/* ===== Datos ===== */
const entradasDe=ing=>Object.values(M.e).filter(e=>norm(e.ing)===norm(ing)).sort((a,b)=>a.fecha===b.fecha?b.ts-a.ts:(a.fecha<b.fecha?1:-1));
function loteActual(ing,fecha){const l=entradasDe(ing);return l.find(e=>e.fecha<=fecha)||l[0]||null}
const tartasOrden=()=>Object.values(M.t).sort((a,b)=>a.fecha===b.fecha?b.ts-a.ts:(a.fecha<b.fecha?1:-1));
function compress(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),img=new Image();
  img.onload=()=>{const m=1100,s=Math.min(1,m/Math.max(img.width,img.height)),c=document.createElement('canvas');
    c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',0.72))};
  img.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('foto'))};img.src=u})}
function fillThumbs(root){$$('img[data-foto]',root).forEach(img=>getFoto(img.dataset.foto).then(d=>{if(d)img.src=d;else img.remove()}))}
function shareFile(name,text,type){
  const blob=new Blob([text],{type:type});
  try{const f=new File([blob],name,{type:type});if(navigator.maxTouchPoints>0&&navigator.canShare&&navigator.canShare({files:[f]}))return navigator.share({files:[f],title:name}).then(()=>true,e=>{if(e&&e.name!=='AbortError')throw e;return false})}catch(e){}
  const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(u);a.remove()},4000);return Promise.resolve(true)}

/* ===== Entradas ===== */
const CAM='<svg width="34" height="34" viewBox="0 0 24 24"><path d="M3 8h3l2-3h8l2 3h3v11H3z"/><circle cx="12" cy="13" r="4"/></svg>';
function vEntradas(){
  const c=M.cfg,t=today();
  let h=avisoCopia()+'<p class="lead">¿Qué te ha llegado?</p><div class="tiles">';
  c.ingredientes.forEach(ing=>{const e=loteActual(ing,t);
    h+='<button class="tile" data-act="entrada" data-ing="'+esc(ing)+'"><span class="tn">'+esc(ing)+'</span>'+
      (e?'<span class="tl">Lote <span class="code">'+esc(e.lote||'en la foto')+'</span></span><span class="ts">'+(e.marca?esc(e.marca)+' · ':'')+'entró el '+fshort(e.fecha)+'</span>':'<span class="tl warn">Sin lote todavía</span>')+
      (e&&e.foto?'<img class="thumb" data-foto="'+esc(e.id)+'" alt="">':'')+'</button>'});
  h+='<button class="tile add" data-act="ing-nuevo">+ Añadir ingrediente</button></div>';
  const ult=Object.values(M.e).sort((a,b)=>b.ts-a.ts).slice(0,6);
  if(ult.length){h+='<h3>Últimas entradas</h3>';ult.forEach(e=>{h+=cardEntrada(e)})}
  else h+='<div class="empty" style="margin-top:14px"><b>Empieza por aquí</b>Cuando te llegue el queso, la nata o los huevos, toca su botón, hazle una foto al lote y guarda.</div>';
  return h}
function cardEntrada(e){return '<button class="card" data-act="ver-entrada" data-id="'+esc(e.id)+'"><div class="th"><b>'+esc(e.ing)+'</b><span class="pill">'+fshort(e.fecha)+'</span></div>'+
  '<div class="small">Lote <span class="code">'+esc(e.lote||'en la foto')+'</span>'+(e.marca?' · '+esc(e.marca):'')+(provNom(e)?' · '+esc(provNom(e)):'')+(e.cad?' · <span class="muted">cad. '+fdate(e.cad)+'</span>':'')+'</div></button>'}
function formEntrada(ing,edit,after){
  const e=edit||{},prev=entradasDe(ing)[0];let foto=null;const tenia=!!e.foto;
  const marcas=[...new Set(entradasDe(ing).map(x=>x.marca).filter(Boolean))];
  sheet('<h2>'+(edit?'Editar entrada de ':'Ha llegado: ')+esc(ing)+'</h2>'+
   '<button type="button" class="photo" id="ph-btn"><span id="ph-txt" style="display:flex;flex-direction:column;align-items:center;gap:8px;padding:20px">'+CAM+'Hacer foto al lote y la fecha</span><img id="ph-img" hidden alt="Foto del lote"></button>'+
   '<label for="en-lote">Número de lote</label><input id="en-lote" class="lote" value="'+esc(e.lote||'')+'" autocapitalize="characters" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="Ej. L2611A">'+
   '<div class="hint" id="en-hint">'+(CLOUD?'Al hacer la foto, la app lee el lote, la caducidad y la marca. Revisa que estén bien.':'Escríbelo mirando la foto. También puedes tocar el campo y usar «Escanear texto» del iPhone.')+'</div>'+
   '<label for="en-prov">Proveedor</label>'+provSelect('en-prov',e.id?e.provId:(prev&&prev.provId))+
   '<label for="en-marca">Marca</label><input id="en-marca" list="dl-m" value="'+esc(e.marca!=null?e.marca:(prev&&prev.marca)||'')+'" placeholder="Ej. la marca del queso"><datalist id="dl-m">'+marcas.map(m=>'<option value="'+esc(m)+'">').join('')+'</datalist>'+
   '<div class="two"><div><label for="en-f">Día que entra</label><input id="en-f" type="date" value="'+(e.fecha||today())+'"></div>'+
   '<div><label for="en-c">Caducidad <span style="font-weight:400">(opcional)</span></label><input id="en-c" type="date" value="'+(e.cad||'')+'"></div></div>'+
   (edit?'':'<button type="button" class="btn full" id="fac-btn" style="margin-top:16px">+ Foto de la factura o albarán</button><img id="fac-img" class="bigphoto" hidden alt="Factura">')+
   '<button class="btn pri big" id="en-save">Guardar</button>'+(edit?'<button class="btn danger full" id="en-del" style="margin-top:10px">Borrar esta entrada</button>':''));
  const show=d=>{$('#ph-img').src=d;$('#ph-img').hidden=false;$('#ph-txt').innerHTML='<span class="again">Toca para repetir la foto</span>';$('#ph-txt').style.padding='0';$('#ph-btn').classList.add('has');$('#ph-btn').appendChild($('#ph-txt'))};
  if(tenia)getFoto(e.id).then(d=>{if(d)show(d)});
  $('#ph-btn').onclick=()=>{const inp=$('#ph-in');inp.value='';inp.onchange=()=>{const f=inp.files&&inp.files[0];if(!f)return;
    compress(f).then(d=>{foto=d;show(d);if(CLOUD)autoLote(d);else if(!$('#en-lote').value)$('#en-lote').focus()}).catch(()=>toast('No se pudo usar esa foto'))};inp.click()};
  let factura=null;montarProvSelect('en-prov');
  if($('#fac-btn'))$('#fac-btn').onclick=()=>pickPhoto(d=>{factura=d;$('#fac-img').src=d;$('#fac-img').hidden=false;$('#fac-btn').textContent='Repetir foto de la factura'});
  $('#en-save').onclick=()=>{
    const lote=$('#en-lote').value.trim().toUpperCase();
    if(!lote&&!foto&&!tenia){toast('Haz la foto o escribe el número de lote');return}
    leerProvSelect('en-prov').then(pv=>{if(pv===false)return;
    const o={id:e.id||uid(),ing:ing,lote:lote,marca:$('#en-marca').value.trim(),provId:pv?pv.id:'',provNombre:pv?pv.nombre:'',fecha:$('#en-f').value||today(),cad:$('#en-c').value,foto:!!(foto||tenia),ts:e.ts||Date.now()};
    return (foto?saveFoto(o.id,foto):Promise.resolve()).then(()=>saveRec('e',o))
     .then(()=>{if(!factura)return;const dc={id:uid(),tipo:'Factura',nombre:ing+(o.marca?' · '+o.marca:''),provId:o.provId,provNombre:o.provNombre,fecha:o.fecha,vence:'',eid:o.id,ts:Date.now()};
       return saveFoto('doc_'+dc.id,factura).then(()=>saveRec('d',dc))}).then(()=>{toast('Guardado: '+ing+(lote?' · lote '+lote:'')+(factura?' · factura apuntada':''));closeSheet();if(after)setTimeout(after,50)})}).catch(()=>{})};
  if(edit)confirmBtn($('#en-del'),'Pulsa otra vez para borrar',()=>{delRec('e',e.id).then(()=>{delFoto(e.id);closeSheet();toast('Entrada borrada')})})}
function verEntrada(id){const e=M.e[id];if(!e)return;
  const usos=tartasOrden().filter(t=>t.ings.some(i=>i.eid===e.id));
  sheet('<h2>'+esc(e.ing)+'</h2>'+(e.foto?'<img class="bigphoto" data-foto="'+esc(e.id)+'" alt="Foto del lote">':'')+
   '<div class="lots"><span class="k">Lote</span><span class="code">'+esc(e.lote||'en la foto')+'</span><span class="k">Marca</span><span>'+esc(e.marca||'—')+'</span><span class="k">Proveedor</span><span>'+esc(provNom(e)||'—')+'</span>'+
   '<span class="k">Entró</span><span>'+fdate(e.fecha)+'</span><span class="k">Caducidad</span><span>'+fdate(e.cad)+'</span></div>'+
   '<h3>Tartas hechas con este lote</h3>'+(usos.length?usos.map(t=>'<div class="small">'+fdate(t.fecha)+' · '+esc(t.sabor)+' · '+t.uds+' ud.</div>').join(''):'<div class="small muted">Todavía ninguna.</div>')+
   '<button class="btn full" id="ve-ed" style="margin-top:18px">Editar</button>');
  fillThumbs($('#sheet'));$('#ve-ed').onclick=()=>formEntrada(e.ing,e)}

/* ===== Tartas ===== */
function vTartas(){
  const c=M.cfg,t=today();
  if(!diaReg)diaReg=t;
  const total=c.sabores.reduce((a,s)=>a+(cnt[s.id]||0),0);
  let h=avisoCopia()+'<p class="lead">¿Cuántas has hecho?</p>'+
   '<div class="diarow"><label for="tr-f">Día</label><input id="tr-f" type="date" value="'+diaReg+'"></div>'+
   '<div class="card sabores">'+(c.sabores.length?c.sabores.map(s=>{const n=cnt[s.id]||0,
      ya=Object.values(M.t).filter(x=>x.fecha===diaReg&&x.saborId===s.id).reduce((a,x)=>a+(+x.uds||0),0),falta=s.ings.filter(i=>!loteActual(i,diaReg));
    return '<div class="srow'+(n?' on':'')+'"><div class="sinfo"><b>'+esc(s.nombre)+'</b>'+
      '<div class="small muted">'+(ya?'Ya guardadas ese día: '+ya+' · ':'')+'<button type="button" class="link" data-act="tarta" data-id="'+esc(s.id)+'">Ver lotes</button>'+(esInv()?'':' · <button type="button" class="link" data-act="sabor-editar" data-id="'+esc(s.id)+'">Ingredientes</button>')+'</div>'+
      (falta.length?'<div class="small warn">Falta el lote de '+esc(falta.join(', '))+'</div>':'')+'</div>'+
      '<div class="step"><button type="button" data-step="-1" data-id="'+esc(s.id)+'" aria-label="Una menos de '+esc(s.nombre)+'">−</button><output>'+n+'</output>'+
      '<button type="button" data-step="1" data-id="'+esc(s.id)+'" aria-label="Una más de '+esc(s.nombre)+'">+</button></div></div>'}).join(''):'<div class="small muted" style="padding:12px 0">Añade tu primer sabor.</div>')+'</div>'+
   '<button class="btn pri big" id="tr-save"'+(total?'':' disabled')+'>'+(total?'Guardar '+total+' tarta'+(total===1?'':'s'):'Pulsa + en las que has hecho')+'</button>'+
   (esInv()?'':'<button class="tile add" data-act="sabor-nuevo" style="width:100%;margin-top:12px">+ Añadir sabor</button>');
  const dias=[...new Set(Object.values(M.t).map(x=>x.fecha))];if(!dias.includes(t))dias.push(t);dias.sort().reverse();
  if(!diaSel||!dias.includes(diaSel))diaSel=t;
  h+='<button class="btn full" data-act="alergenos" style="margin-top:10px">Tabla de alérgenos</button>';
  h+='<h3>Tartas hechas el día</h3><select id="dia" aria-label="Elegir día">'+dias.slice(0,120).map(d=>{const n=udsDia(d);
    return '<option value="'+d+'"'+(d===diaSel?' selected':'')+'>'+diaLabel(d)+' · '+n+' tarta'+(n===1?'':'s')+'</option>'}).join('')+'</select><div id="dia-l" style="margin-top:10px">'+listaDia(diaSel)+'</div>';
  return h}
let diaSel='',diaReg='',cnt={};
function guardarCuenta(){
  const c=M.cfg,f=diaReg||today(),lista=c.sabores.filter(s=>cnt[s.id]>0);if(!lista.length)return;
  const ps=lista.map(s=>saveRec('t',{id:uid(),saborId:s.id,sabor:s.nombre,fecha:f,uds:cnt[s.id],
    ings:s.ings.map(ing=>{const e=loteActual(ing,f);return e?{ing:ing,lote:e.lote||'',marca:e.marca||'',eid:e.id}:{ing:ing,lote:'',marca:'',eid:''}}),

function limpiarCopia(o){const N=v=>{const n=Number(v);return isFinite(n)?n:0},Nn=v=>v==null||v===''?null:N(v),obj=v=>v&&typeof v==='object'&&!Array.isArray(v)?v:{};

function avisos(){
  const A=[],t=today(),c=M.cfg;if(!c)return A;
  if(!persistOk)A.push({k:'bad',t:'Los datos no se están guardando',s:CLOUD?'Abre la app con tu cuenta de Claude y con conexión.':'Abre la app desde su icono de la pantalla de inicio.'});
  if(!CLOUD&&!c.avisoCal)A.push({k:'warn',t:'Activa el aviso diario de las '+(c.horaAviso||'16:00'),s:'Así el iPhone te avisa cada día aunque no abras la app',cal:1,b:'Activar'});
  if(typeof syncAviso==='function'){const sa=syncAviso();if(sa)A.push(sa)}
  const faltan=c.camaras.filter(x=>!M.c[t+'_'+x.id]);
  if(faltan.length)A.push({k:'warn',t:'Falta la temperatura de hoy',s:faltan.map(x=>x.nombre).join(', '),tab:'camara',b:'Anotar'});
  const mal=c.camaras.map(x=>M.c[t+'_'+x.id]).filter(r=>r&&!r.ok);
  if(mal.length)A.push({k:'bad',t:'Temperatura fuera de 0–4 °C hoy',s:mal.map(r=>r.camNombre+' '+r.v+' °C').join(', '),tab:'camara',b:'Ver'});
  const diarias=c.limpieza.map((x,i)=>({x:x,i:i})).filter(o=>!/seman/i.test(o.x)),sin=diarias.filter(o=>!M.l[t+'_'+o.i]).length;
  if(sin)A.push({k:'warn',t:'Limpieza de hoy sin marcar',s:sin+' de '+diarias.length+' tareas',tab:'camara',b:'Marcar'});
  c.limpieza.forEach((x,i)=>{if(!/seman/i.test(x))return;if(!Object.values(M.l).some(r=>r.i===i&&daysBetween(r.fecha,t)<7))A.push({k:'warn',t:'Limpieza semanal pendiente',s:x,tab:'camara',b:'Marcar'})});

  events.forEach(e=>L.push.apply(L,e));L.push('END:VCALENDAR');

const WD_CORTO=['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
function rangoStats(r){const t=today();
  if(r==='mes')return [t.slice(0,8)+'01',t];
  if(r==='pasado'){const p=sumarMeses(t.slice(0,8)+'01',-1);return [p,sumarDias(t.slice(0,8)+'01',-1)]}
  if(r==='3m')return [sumarMeses(t,-3),t];
  if(r==='anio')return [t.slice(0,4)+'-01-01',t];
  const fs=Object.values(M.t).map(x=>x.fecha).sort();return [fs[0]||t,t]}
function datosStats(d,h){
  const T=Object.values(M.t).filter(x=>x.fecha>=d&&x.fecha<=h),total=T.reduce((a,x)=>a+(+x.uds||0),0);
  const dias=new Set(T.map(x=>x.fecha)).size,ps={};T.forEach(x=>{ps[x.sabor]=(ps[x.sabor]||0)+(+x.uds||0)});
  const porSabor=Object.keys(ps).map(k=>({k:k,v:ps[k]})).sort((a,b)=>b.v-a.v);
  const pm={};T.forEach(x=>{const k=x.fecha.slice(0,7);pm[k]=(pm[k]||0)+(+x.uds||0)});
  const meses=[];let k=h.slice(0,7);for(let i=0;i<12;i++){meses.unshift(k);if(k<=d.slice(0,7))break;const p=k.split('-');const dt=new Date(+p[0],+p[1]-2,1);k=dt.getFullYear()+'-'+pad(dt.getMonth()+1)}
  const porMes=meses.map(m=>({k:m,v:pm[m]||0}));
  const ws=[0,0,0,0,0,0,0];T.forEach(x=>{const p=x.fecha.split('-');ws[(new Date(+p[0],+p[1]-1,+p[2]).getDay()+6)%7]+=(+x.uds||0)});
  return {total:total,dias:dias,media:dias?total/dias:0,porSabor:porSabor,porMes:porMes,porDia:ws.map((v,i)=>({k:WD_CORTO[i],v:v}))}}

/* ---- limpiar lo que llega de internet antes de guardarlo ---- */
const F8S=/^\d{4}-\d{2}-\d{2}$/;
function sanear(k,d){if(!d||typeof d!=='object'||Array.isArray(d))return null;
  if(k==='cfg'){try{return limpiarCopia({app:'obrador-sencillo',cfg:JSON.parse(JSON.stringify(d)),fotos:{}}).cfg}catch(e){return null}}
  d=JSON.parse(JSON.stringify(d));if(!F8S.test(String(d.fecha)))return null;
  ['cad','vence'].forEach(f=>{if(d[f]!=null&&d[f]!==''&&!F8S.test(String(d[f])))d[f]=''});
  if(k==='c'){d.v=Number(d.v);if(!isFinite(d.v))return null;d.ok=!!d.ok}
  if(k==='t'){d.uds=Number(d.uds)||0;if(!Array.isArray(d.ings))d.ings=[];if(Array.isArray(d.alergenos))d.alergenos=d.alergenos.map(String).filter(a=>ALERG.includes(a))}
  if(k==='l')d.i=Number(d.i)||0;if(d.lote!=null)d.lote=String(d.lote);return d}
/* ---- subir cambios ---- */
function push(){const o=outLeer(),ks=Object.keys(o);if(!ks.length)return Promise.resolve();
  const quitar=(k,v)=>{const oo=outLeer();if(oo[k]&&oo[k][1]===v[1])delete oo[k];outGuardar(oo)};
  const R=ks.filter(k=>k[0]==='r').map(k=>{const c=k.slice(2);let d;if(c==='cfg')d=M.cfg;else{const i=c.indexOf(':');d=(M[c.slice(0,i)]||{})[c.slice(i+1)]}
    const b=o[k][0]===1||d===undefined;const fila={clave:c,datos:b?null:d,borrado:b};if(ES_INV())fila.user_id=SY.dueno;return {k:k,v:o[k],fila:fila}});
  if(ES_INV()){const oo=outLeer();let cambio=false;R.filter(x=>x.fila.clave==='cfg').forEach(x=>{delete oo[x.k];cambio=true});if(cambio)outGuardar(oo);for(let i=R.length-1;i>=0;i--)if(R[i].fila.clave==='cfg')R.splice(i,1)}
  let p=Promise.resolve();
  for(let i=0;i<R.length;i+=200){const lote=R.slice(i,i+200);
    p=p.then(()=>api('/rest/v1/registros?on_conflict=user_id,clave',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:lote.map(x=>x.fila)}).then(()=>lote.forEach(x=>quitar(x.k,x.v))))}
  ks.filter(k=>k[0]==='f').forEach(k=>{const c=k.slice(2),v=o[k];
    p=p.then(()=>getFoto(c)).then(d=>{const b=v[0]===1||!d;
      return api('/rest/v1/fotos?on_conflict=user_id,clave',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:[Object.assign({clave:c,datos:b?null:d,borrado:b},ES_INV()?{user_id:SY.dueno}:{})]}).then(()=>quitar(k,v))})});
  return p}
/* ---- bajar cambios ---- */
function aplicar(tabla,rows,vistos){const pend=outLeer(),ops=[];let n=0;
  rows.forEach(r=>{if(vistos)vistos.add((tabla==='fotos'?'f|':'r|')+r.clave);
    if(tabla==='fotos'){if(pend['f|'+r.clave])return;
      if(r.borrado){if(fotoMem[r.clave]!==undefined||true){delete fotoMem[r.clave];ops.push(s=>s.delete(r.clave))}return}
      if(typeof r.datos!=='string'||!/^data:image\/(jpeg|png|webp);base64,/.test(r.datos))return;
      if(fotoMem[r.clave]!==r.datos){fotoMem[r.clave]=r.datos;ops.push(s=>s.put(r.datos,r.clave));n++}return}
    if(pend['r|'+r.clave])return;
    if(r.clave==='cfg'){if(r.borrado)return;const d=sanear('cfg',r.datos);if(d&&JSON.stringify(M.cfg)!==JSON.stringify(d)){M.cfg=d;ops.push(s=>s.put(d,'cfg'));n++}return}
    const i=r.clave.indexOf(':'),k=r.clave.slice(0,i),id=r.clave.slice(i+1);if(!M[k]||k==='f')return;
    if(r.borrado){if(M[k][id]){delete M[k][id];ops.push(s=>s.delete(r.clave));n++}return}
    const d=sanear(k,r.datos);if(d&&JSON.stringify(M[k][id])!==JSON.stringify(d)){M[k][id]=d;ops.push(s=>s.put(d,r.clave));n++}});
  return (ops.length?tx(tabla==='fotos'?'fotos':'kv',s=>ops.forEach(f=>f(s))):Promise.resolve()).then(()=>n)}
function pull(tabla,campo,vistos){const desdeTs=SY[campo]?new Date(new Date(SY[campo]).getTime()-5000).toISOString():'1970-01-01T00:00:00Z';
  let off=0,max=SY[campo]||'',total=0;
  const pagina=()=>api('/rest/v1/'+tabla+'?select=clave,datos,borrado,actualizado&actualizado=gt.'+encodeURIComponent(desdeTs)+'&order=actualizado.asc,clave.asc&limit=200&offset='+off)
    .then(rows=>{rows=rows||[];rows.forEach(r=>{if(r.actualizado>max)max=r.actualizado});
      return aplicar(tabla,rows,vistos).then(n=>{total+=n;if(rows.length===200){off+=200;return pagina()}if(max){SY[campo]=max;sySave()}return total})});
  return pagina()}

   '<label for="hi-n">Tu nombre</label><input id="hi-n" autocomplete="name" placeholder="Ej. Laura">'+
   '<button class="btn pri big" id="hi-go">Entrar como invitado</button>'+
   (navigator.standalone===false&&/iPhone|iPad/.test(navigator.userAgent)?'<div class="hint">Consejo: primero añade la app a la pantalla de inicio (Compartir › Añadir a pantalla de inicio), ábrela y pega este enlace en Ajustes › Conectividad.</div>':''));
  $('#hi-go').onclick=()=>{const n=$('#hi-n').value.trim();if(!n){toast('Escribe tu nombre');return}$('#hi-go').disabled=true;
    const tmp={url:inv.u,key:inv.k,rol:'invitado',disp:nuevoDisp(),estado:'',lastR:'',lastF:'',ok:0,err:'',negocio:inv.n,nombre:n};const ant=SY;SY=tmp;
    rpc('invitacion_usar',{p_codigo:inv.c,p_id:tmp.disp.id,p_secreto:tmp.disp.s,p_nombre:n}).then(r=>{
      if(!r||!r.ok){SY=ant;toast('La invitación no es válida o ha caducado. Pide otra.');$('#hi-go').disabled=false;return}
      SY.dueno=r.dueno;SY.estado='aprobado';sySave();
      return borrarLocal().then(()=>conectarPrimeraVez()).then(()=>{closeSheet();toast('Has entrado como invitado');render()})})
    .catch(()=>{SY=ant;sySave();$('#hi-go').disabled=false;toast('No se pudo entrar. Revisa la conexión')})}}
function revisarEnlace(){const inv=leerInvitacion(location.hash);if(!inv)return;try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}
  setTimeout(()=>{if(typeof bloqueada!=='undefined'&&bloqueada){const t=setInterval(()=>{if(!bloqueada){clearInterval(t);hojaInvitacion(inv)}},500)}else hojaInvitacion(inv)},300)}
window.addEventListener('hashchange',revisarEnlace);
/* ---- pantalla en Ajustes › Conectividad ---- */
function pintarSync(){const box=document.getElementById('sync-box');if(!box)return;
  const ae=document.activeElement;if(ae&&box.contains(ae)&&/INPUT|TEXTAREA|SELECT/.test(ae.tagName)){const st=$('#sy-st');if(st)st.textContent=textoEstado();return}
  if(SY&&ES_INV()){box.innerHTML='<div class="card"><b>Eres invitado</b><div class="small muted">Obrador '+esc(SY.negocio||'')+(SY.nombre?' · '+esc(SY.nombre):'')+'</div><div class="live '+(SY.err?'warn':'okc')+'">'+esc(textoEstado())+'</div>'+
      '<div class="two" style="margin-top:10px"><button type="button" class="btn" id="sy-now">Sincronizar ahora</button><button type="button" class="btn danger" id="sy-off">Salir</button></div></div>';
    $('#sy-now').onclick=()=>sincronizar(true);
    confirmBtn($('#sy-off'),'Pulsa otra vez: se borran los datos de aquí',()=>{SY=null;sySave();borrarLocal().then(()=>{render();pintarSync();toast('Has salido del obrador')})});return}
  if(SY&&SY.estado==='pendiente'){const c=String(SY.codigo||'');
    box.innerHTML='<div class="card"><b>Esperando tu aprobación</b><div class="small muted">Por seguridad, este aparato no ve nada hasta que lo aceptes desde un aparato tuyo ya aprobado (por ejemplo, tu iPhone).</div>'+
      '<div style="text-align:center;margin:12px 0"><div class="small muted">Código de este aparato</div><span class="code" id="sy-cod" style="font-size:30px;letter-spacing:.12em">'+esc(c.slice(0,3)+' '+c.slice(3))+'</span></div>'+
      '<div class="small">En tu iPhone abre la app: te saldrá «Alguien quiere entrar». Escribe este código y pulsa Aceptar.</div>'+
      '<details class="more" style="margin-top:12px"><summary>¿No tienes el iPhone? Usa tu clave maestra</summary><input id="sy-mk" autocapitalize="characters" autocomplete="off" spellcheck="false" placeholder="XXXX-XXXX-XXXX-XXXX"><button type="button" class="btn full" id="sy-mkgo" style="margin-top:8px">Entrar con la clave maestra</button></details>'+
      '<button type="button" class="btn danger full" id="sy-off" style="margin-top:12px">Cancelar</button></div>';
    $('#sy-mkgo').onclick=()=>{const k=$('#sy-mk').value.trim();if(!k)return;rpc('maestra_usar',{p_id:SY.disp.id,p_secreto:SY.disp.s,p_clave:k}).then(ok=>{if(ok)esperarAprobacion();else toast('Clave maestra incorrecta')}).catch(()=>toast('No se pudo. Revisa la conexión'))};
    confirmBtn($('#sy-off'),'Pulsa otra vez',()=>{SY=null;sySave();pintarSync()});return}
  if(SY){const l=SY.lista||[],yo=SY.disp&&SY.disp.id;
    const fila=d=>'<div class="aj-row"><div><b>'+esc(d.nombre||'Sin nombre')+'</b>'+(d.id===yo?' <span class="pill">Este aparato</span>':'')+
      '<div class="small muted">'+(d.rol==='invitado'?'Invitado':'Administrador')+' · '+(d.aprobado?'último uso '+fHora(d.visto):'<span class="bad">pendiente</span>')+'</div></div>'+
      (d.id===yo?'':d.aprobado?'<button type="button" class="btn sm danger" data-echar="'+esc(d.id)+'">Echar</button>':'<button type="button" class="btn sm" data-pend="'+esc(d.id)+'">Revisar</button>')+'</div>';
    box.innerHTML='<div class="card"><b>Sincronización automática activada</b><div class="small muted">'+esc(SY.email||'')+' · eres el administrador</div><div class="live '+(SY.err?'warn':'okc')+'" id="sy-st">'+esc(textoEstado())+'</div>'+
      '<div class="two" style="margin-top:10px"><button type="button" class="btn" id="sy-now">Sincronizar ahora</button><button type="button" class="btn danger" id="sy-off">Desconectar</button></div></div>'+
      '<h3>Aparatos y personas con acceso</h3>'+(l.length?l.map(fila).join(''):'<div class="small muted">Pulsa «Sincronizar ahora» para ver la lista.</div>')+
      '<h3>Invitar a alguien</h3><div class="small muted">Podrá apuntar, corregir y borrar registros, pero no tocar Ajustes, ni ver tus estadísticas, ni invitar a nadie.</div>'+
      '<label for="iv-n">Nombre de la persona</label><input id="iv-n" placeholder="Ej. Laura"><button type="button" class="btn pri full" id="iv-go" style="margin-top:10px">Crear invitación</button>'+
      '<div id="iv-lista"></div>'+
      '<h3>Clave maestra</h3><div class="small muted">Sirve para entrar como administrador desde un aparato nuevo si pierdes el iPhone.</div><button type="button" class="btn full" id="mk-new" style="margin-top:8px">Hacer una clave maestra nueva</button>';
    $('#sy-now').onclick=()=>SY.err==='sesion'?(SY=null,sySave(),pintarSync()):sincronizar(true).then(pintarSync);
    confirmBtn($('#sy-off'),'Pulsa otra vez',()=>{SY=null;sySave();outGuardar({});pintarSync();toast('Sincronización desconectada. Tus datos siguen en este aparato.')});
    $$('[data-echar]').forEach(b=>{const d=l.find(x=>x.id===b.dataset.echar);confirmBtn(b,'¿Seguro?',()=>echar(d))});
    $$('[data-pend]').forEach(b=>b.onclick=()=>avisoAparato(l.find(x=>x.id===b.dataset.pend)));
    $('#iv-go').onclick=invitar;
    confirmBtn($('#mk-new'),'Pulsa otra vez: la anterior dejará de servir',()=>crearClaveMaestra(()=>{ajustes();abrirSec('aj-syn')}).catch(()=>toast('No se pudo. Revisa la conexión')));
    if(ES_ADMIN_OK())api('/rest/v1/invitaciones?select=id,nombre,creada,caduca,usada&usada=eq.false&order=creada.desc').then(v=>{const w=$('#iv-lista');if(!w)return;
      v=(v||[]).filter(x=>new Date(x.caduca)>new Date());if(!v.length){w.innerHTML='';return}
      w.innerHTML='<div class="small muted" style="margin-top:10px">Invitaciones sin usar</div>'+v.map(x=>'<div class="aj-row"><div><b>'+esc(x.nombre)+'</b><div class="small muted">caduca '+fHora(x.caduca)+'</div></div><button type="button" class="btn sm" data-ivx="'+esc(x.id)+'">Cancelar</button></div>').join('');
      $$('[data-ivx]').forEach(b=>b.onclick=()=>rpc('invitacion_cancelar',{p_id:b.dataset.ivx}).then(()=>{toast('Invitación cancelada');pintarSync()}).catch(()=>toast('No se pudo')))}).catch(()=>{});
    return}
  box.innerHTML='<div class="small muted">Conecta tu base de datos para que el iPhone y el Mac tengan siempre lo mismo, sin hacer nada.</div>'+
    '<label for="sy-u">Dirección del proyecto (Project URL)</label><input id="sy-u" inputmode="url" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="https://xxxx.supabase.co">'+
    '<label for="sy-k">Clave pública (anon public o publishable)</label><textarea id="sy-k" rows="3" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="eyJhbGciOi..."></textarea>'+
    '<label for="sy-e">Email de tu usuario</label><input id="sy-e" type="email" autocapitalize="none" autocorrect="off">'+
    '<label for="sy-p">Contraseña de tu usuario</label><input id="sy-p" type="password">'+
    '<button type="button" class="btn pri big" id="sy-go">Conectar como administrador</button><div class="hint">La contraseña no se guarda en la app. Un aparato nuevo no ve nada hasta que lo apruebes.</div>'+
    '<h3>¿Te han invitado?</h3><label for="sy-inv">Pega aquí el enlace de invitación</label><input id="sy-inv" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="https://…#inv=…"><button type="button" class="btn full" id="sy-invgo" style="margin-top:8px">Usar invitación</button>';
  $('#sy-invgo').onclick=()=>{const inv=leerInvitacion($('#sy-inv').value);if(!inv){toast('Ese enlace no es una invitación válida');return}hojaInvitacion(inv)};
  $('#sy-go').onclick=()=>{const b=$('#sy-go');b.disabled=true;b.textContent='Conectando…';
    conectarAdmin($('#sy-u').value,$('#sy-k').value,$('#sy-e').value,$('#sy-p').value)
      .catch(e=>{SY=null;sySave();toast(e.message||'No se pudo conectar');b.disabled=false;b.textContent='Conectar como administrador'})}}
function syncAviso(){if(!SY)return null;
  if(SY.err==='sesion'&&!ES_INV())return {k:'bad',t:'La sincronización está desconectada',s:'Vuelve a conectar en Ajustes',aj:1,b:'Ajustes'};
  if(!ES_INV()&&SY.estado==='pendiente')return {k:'warn',t:'Este aparato espera tu aprobación',s:'Código '+(SY.codigo||''),aj:1,b:'Ver'};
  const p=pendientes();if(p.length)return {k:'bad',t:'Alguien quiere entrar en tu base de datos',s:p.map(d=>d.nombre).join(', ')+' · acéptalo solo si eres tú',aj:1,b:'Revisar'};
  if(navigator.onLine&&SY.ok&&Date.now()-SY.ok>86400000)return {k:'warn',t:'Hace más de un día que no se sincroniza',s:'Abre la app con internet o revisa Ajustes',aj:1,b:'Ajustes'};return null}
revisarEnlace();

/* ---- Ajustes para invitados: solo su seguridad y su conexión ---- */
function ajustesInvitado(){
  const sec=(id,t,x,c)=>'<details class="aj" id="'+id+'"><summary><span>'+t+'</span>'+(x?'<span class="aj-x">'+x+'</span>':'')+'</summary><div class="aj-b">'+c+'</div></details>';
  sheet('<h2>Ajustes</h2><div class="small muted" style="margin-bottom:10px">Eres invitado: los ajustes del obrador solo los cambia el administrador.</div>'+
   sec('aj-seg','Seguridad',pinGet()?'Activada':'Sin bloqueo','<div id="seg-box">'+secSeguridad()+'</div>')+
   sec('aj-syn','Conectividad','Invitado','<div id="sync-box"></div>'));
  montarSeguridad();pintarSync()}

function autoLote(){}function autoDoc(){}
